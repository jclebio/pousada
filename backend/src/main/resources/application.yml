server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: pousada-gestao-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pousada_db}
    username: ${SPRING_DATASOURCE_USERNAME:pousada}
    password: ${SPRING_DATASOURCE_PASSWORD:pousada123}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:smtNh11FPlhTkyBaln3r0TbGmnHZlrmS55Gm3mvpCZo=}
    expiration-hours: ${JWT_EXPIRATION_HOURS:720}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
  whatsapp:
    webhook-url: ${WHATSAPP_WEBHOOK_URL:}
    api-token: ${WHATSAPP_API_TOKEN:}
    destino-grupo: ${WHATSAPP_DESTINO_GRUPO:}
